services:
  - type: web
    name: pricing-the-heat-backend
    env: docker
    plan: free
    dockerfilePath: ./infra/backend.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # PORT is NOT declared here -- Render injects it automatically into every
    # web service's container at runtime; declaring it as an envVar (even
    # with sync: false) risks Render prompting for a manual value during
    # Blueprint deploy, which would block on a variable that's already set.
    envVars:
      - key: FRONTEND_ORIGIN
        value: "*"
        # Tighten this to the deployed Vercel URL (e.g.
        # https://pricing-the-heat.vercel.app) once the frontend is live.
      - key: ANTHROPIC_API_KEY
        sync: false
        # Optional -- /assistant/ask works via its deterministic no-key
        # fallback (backend/assistant/fallback.py) if this is left unset.
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5
