services:
  - type: web
    name: pricing-the-heat-backend
    env: docker
    plan: free
    dockerfilePath: ./infra/backend.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        # Render sets this itself at runtime; declared here only so it shows
        # up in the dashboard -- do not hardcode a value.
        sync: false
      - key: FRONTEND_ORIGIN
        value: "*"
        # Tighten this to the deployed Vercel URL (e.g.
        # https://pricing-the-heat.vercel.app) once the frontend is live.
      - key: ANTHROPIC_API_KEY
        sync: false
        # Optional -- /assistant/ask works via its deterministic no-key
        # fallback (backend/assistant/fallback.py) if this is left unset.
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5
